name: Validate & Auto-merge PRs

on:
  push:
    branches:
      - dave
      - brandonnn
      - supabase-integration
      - Jeferson
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: write
  checks: write

jobs:
  validate-and-merge:
    runs-on: ubuntu-latest
    name: Validate & Auto-merge
    if: github.event_name == 'push' && github.ref_name != 'main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.11.3'
          cache: true
      
      - name: Validate code
        run: |
          flutter analyze
          flutter test --coverage
        continue-on-error: true
      
      - name: Merge to main
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git fetch origin main
          git checkout main
          git merge --squash origin/${{ github.ref_name }}
          git commit -m "chore: merge ${{ github.ref_name }} → main [skip ci]" || echo "No changes to commit"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  auto-merge-pr:
    runs-on: ubuntu-latest
    name: Auto-merge PR
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Enable auto-merge
        uses: pascalgn/automerge-action@v0.15.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_METHOD: squash
          MERGE_COMMIT_MESSAGE: auto
          UPDATE_METHOD: rebase
          MERGE_LABELS: ""
          MERGE_FORKS: false
