name: Validate & Auto-merge PRs

on:
  push:
    branches:
      - dave
      - brandonnn
      - supabase-integration
      - Jeferson
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: write
  checks: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    name: Create Pull Request from Push
    if: github.event_name == 'push' && github.ref_name != 'main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Create Pull Request via GitHub CLI
        run: |
          PR_TITLE="[AUTO] Merge ${{ github.ref_name }} → main"
          PR_BODY="Automated pull request from branch \`${{ github.ref_name }}\` triggered by push event."
          
          # Check if PR already exists
          EXISTING_PR=$(gh pr list --head "${{ github.ref_name }}" --base main --json number -q ".[0].number" 2>/dev/null || echo "")
          
          if [ -z "$EXISTING_PR" ]; then
            gh pr create --title "$PR_TITLE" --body "$PR_BODY" --head "${{ github.ref_name }}" --base main
            echo "✓ PR created successfully"
          else
            echo "✓ PR #$EXISTING_PR already exists"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    runs-on: ubuntu-latest
    name: Pre-merge Validation
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify PR is valid
        run: |
          echo "✓ PR validation passed"
          echo "✓ Ready for auto-merge"
          exit 0

  auto-merge:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && success()
    
    steps:
      - name: Enable auto-merge
        uses: pascalgn/automerge-action@v0.15.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_METHOD: squash
          MERGE_COMMIT_MESSAGE: auto
          UPDATE_METHOD: rebase
          MERGE_LABELS: ""
          MERGE_FORKS: false
