name: CI/CD - Flutter Analysis & Testing

on:
  pull_request:
    branches:
      - main
      - dave
  push:
    branches:
      - main
      - dave

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.11.3'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run unit tests
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

      - name: Comment PR with results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const job = context.payload.pull_request;
            if (job && context.eventName === 'pull_request') {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '✅ CI checks passed!\n\n- Flutter analyze: ✓\n- Unit tests: ✓\n- Ready to merge'
              });
            }

  auto-merge:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'opened' || github.event.action == 'synchronize'
    
    steps:
      - name: Auto-merge if all checks pass
        uses: pascalgn/automerge-action@v0.15.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_METHOD: squash
          MERGE_COMMIT_MESSAGE: auto
          UPDATE_METHOD: rebase
