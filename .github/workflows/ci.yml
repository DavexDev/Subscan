name: CI/CD - Flutter Analysis

on:
  pull_request:
    branches:
      - main
      - dave
  push:
    branches:
      - main
      - dave

jobs:
  analyze:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'latest'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze
        continue-on-error: false
