name: CI/CD - Flutter Analysis & Testing

on:
  pull_request:
    branches:
      - main
      - dave
  push:
    branches:
      - main
      - dave

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze

      - name: Run unit tests
        run: flutter test --coverage 2>&1 || true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage/

      - name: Check test results
        run: |
          if [ -f coverage/lcov.info ]; then
            echo "✓ Tests completed with coverage"
          else
            echo "⚠ Coverage not generated"
          fi
